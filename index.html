<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Léger">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1118" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Carnet Léger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app. Sticky date header, scrolling day view, fixed tab bar with a central add button, bottom sheets for entry. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E8ECF2; --ink:#131A26; --muted:#5B6577; --line:#DBE1EA;
  --eat:#E95A30; --eat-soft:#FCE6DE; --burn:#0F9A82; --burn-soft:#D9F2EC; --accent:#2B46CC; --accent-soft:#E2E7FB;
  --warn:#B97C00; --bad:#C93434; --shadow:0 10px 30px rgba(19,26,38,.10);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1118; --surface:#161C27; --surface-2:#212938; --ink:#EDF0F6; --muted:#98A2B4; --line:#2A3344;
  --eat:#FF7A52; --eat-soft:#3A2119; --burn:#2DC8AA; --burn-soft:#13302B; --accent:#8196FF; --accent-soft:#1E2647;
  --warn:#E2A82B; --bad:#FF6B6B; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1118; --surface:#161C27; --surface-2:#212938; --ink:#EDF0F6; --muted:#98A2B4; --line:#2A3344;
  --eat:#FF7A52; --eat-soft:#3A2119; --burn:#2DC8AA; --burn-soft:#13302B; --accent:#8196FF; --accent-soft:#1E2647;
  --warn:#E2A82B; --bad:#FF6B6B; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.top .wrap{display:flex;align-items:center;gap:8px;padding-block:10px}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:7px;background:conic-gradient(var(--eat) 0 62%,var(--burn) 62% 100%);display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;inset:5px;border-radius:4px;background:var(--bg)}
.datenav{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.datenav button{border:0;background:none;width:34px;height:34px;border-radius:999px;font-size:18px;color:var(--muted)}
.datenav span{font-weight:600;font-size:13px;min-width:92px;text-align:center}

main{padding-block:6px calc(110px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;border:1px solid var(--line)}
.card h2{font-size:17px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted)}

/* demo banner */
.banner{display:flex;gap:12px;align-items:center;background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:13.5px}
.banner b{display:block}
.banner button{margin-left:auto;flex:none}

/* budget hero */
.budget{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-family:var(--display);font-size:34px;font-weight:800;line-height:1;letter-spacing:-.03em}
.ring .lbl{font-size:12px;color:var(--muted);margin-top:4px}
.eq{display:flex;flex-direction:column;gap:8px;min-width:0}
.eq div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.eq div b{font-variant-numeric:tabular-nums;font-weight:600}
.eq .op{color:var(--muted);font-weight:600;width:14px;display:inline-block}
.eq hr{border:0;border-top:1px dashed var(--line);margin:2px 0;width:100%}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}
.over .big{color:var(--bad)}

.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.macro .bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.macro .bar i{display:block;height:100%;border-radius:6px}
.macro small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.macro b{display:block}

/* meals */
.meal{padding:4px 0}
.meal + .meal{border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.meal-h{display:flex;align-items:center;gap:8px;padding:4px 0}
.meal-h h3{font-size:15px;font-family:var(--body);font-weight:600;letter-spacing:0}
.meal-h .k{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.item{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px}
.item .n{min-width:0;flex:1}
.item .n span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .n small{color:var(--muted);font-size:12px}
.item .k{font-variant-numeric:tabular-nums;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);width:28px;height:28px;border-radius:8px;font-size:16px;flex:none}
.x:hover{background:var(--surface-2)}
.addline{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0;font-size:14px}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);flex:none}
.tag.strava{background:#FC4C0222;color:#E04300}
.tag.sante{background:#FF2D5522;color:#D6204A}
.tag.manuel{background:var(--accent-soft);color:var(--accent)}

.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px}
.stat b{font-family:var(--display);font-size:20px;display:block;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}

/* buttons */
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:14.5px}
.btn.alt{background:var(--surface-2);color:var(--ink)}
.btn.acc{background:var(--accent);color:#fff}
.btn.strava{background:#FC4C02;color:#fff}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}

/* forms */
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--ink)}
textarea.i{min-height:90px;font-size:14px;font-family:ui-monospace,Menlo,monospace}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* weight */
.wstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prog{height:10px;border-radius:10px;background:var(--surface-2);overflow:hidden;margin:12px 0 6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--burn),var(--accent));border-radius:10px}
.chart{width:100%;overflow:hidden}
.chart svg{display:block;width:100%;height:auto}
.hist .item{border-top:1px solid var(--line)}

/* connections */
.conn-h{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:800;font-family:var(--display);color:#fff;font-size:18px}
.status{margin-left:auto;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;flex:none}
.status.on{background:var(--burn-soft);color:var(--burn)}
.status.off{background:var(--surface-2);color:var(--muted)}
.status.mid{background:#B97C0022;color:var(--warn)}
details{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
summary{font-weight:600;font-size:14px;cursor:pointer;color:var(--accent)}
ol.steps{padding-left:20px;margin:10px 0 0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:5px;word-break:break-all}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.stack{display:flex;flex-direction:column;gap:10px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center;height:62px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--ink)}
.fab{width:56px;height:56px;border-radius:18px;border:0;background:var(--ink);color:var(--bg);font-size:30px;line-height:1;display:grid;place-items:center;margin:0 auto;transform:translateY(-14px);box-shadow:var(--shadow)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,12,20,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:22px 22px 0 0;max-height:92%;overflow-y:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:8px auto 4px}
.sheet .wrap{display:flex;flex-direction:column;gap:14px;padding-block:6px}
.sheet-h{display:flex;align-items:center;justify-content:space-between}
.sheet-h h2{font-size:21px}
.results{display:flex;flex-direction:column}
.res{display:flex;align-items:center;gap:10px;padding:11px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.res .n{flex:1;min-width:0}
.res .n span{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .n small{color:var(--muted);font-size:12px}
.res .k{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.kcalbig{font-family:var(--display);font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}

/* coach */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:5px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.ai p{margin:0 0 6px}.msg.ai p:last-child{margin:0}
.msg.ai ul{margin:4px 0 6px;padding-left:18px}
.msg .src{display:block;font-size:11px;color:var(--muted);margin-top:6px}
.typing{color:var(--muted);font-style:italic}
.composer{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:24;background:var(--bg);border-top:1px solid var(--line)}
.composer .wrap{display:flex;gap:8px;padding-block:8px}
.composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 16px;font-size:16px}
.composer .send{flex:none;width:44px;height:44px;border-radius:999px;border:0;background:var(--accent);color:#fff;font-size:18px;font-weight:700}
.sugg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sugg .chip{white-space:nowrap;flex:none}
.coach-hero{display:flex;gap:12px;align-items:center}
.coach-hero .logo{background:linear-gradient(135deg,var(--accent),var(--burn))}
main.chatmode{padding-bottom:calc(190px + env(safe-area-inset-bottom,0px))}
/* planning */
.wk-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wk-h button{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:999px;color:var(--muted);font-size:18px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.dbtn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:7px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.dbtn .dn{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
.dbtn .dd{font-family:var(--display);font-weight:700;font-size:17px}
.dbtn .dots{display:flex;gap:2px;height:8px;align-items:center}
.dbtn .dots i{width:7px;height:7px;border-radius:50%}
.dbtn .dots i.plan{background:none;border:1.5px solid var(--muted)}
.dbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dbtn[aria-pressed="true"] .dn{color:var(--bg);opacity:.7}
.dbtn.today .dd{text-decoration:underline;text-underline-offset:3px}
.sess{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.sess .sw{width:10px;height:36px;border-radius:5px;flex:none}
.sess .n{flex:1;min-width:0}.sess .n b{display:block;font-size:14.5px}.sess .n small{color:var(--muted);font-size:12.5px}
.advice{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.advice:first-of-type{border-top:0}
.advice .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:800;font-size:14px}
.advice b{display:block;font-size:14px}.advice span{font-size:13.5px;color:var(--muted)}
.sportchips .chip{font-size:13px}
.hbtns{display:flex;gap:6px}
/* meal scan */
.scanbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scanbtn{border:1px dashed var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:14px;text-align:center;cursor:pointer}
.scanbtn small{font-weight:400;color:var(--muted);font-size:12px}
.scanbtn svg{width:26px;height:26px;color:var(--accent)}
.photo{width:100%;max-height:220px;object-fit:cover;border-radius:14px;display:block}
.drow{display:grid;grid-template-columns:1fr 74px 64px 28px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.drow input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;font-size:16px;color:var(--ink);width:100%;min-width:0}
.drow .kc{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.drow .unit{position:relative}
.drow .unit::after{content:"g";position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.drow .unit input{padding-right:20px}
.dhead{display:grid;grid-template-columns:1fr 74px 64px 28px;gap:6px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.conf{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px}
.spin{width:22px;height:22px;border:3px solid var(--surface-2);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
/* water + fasting */
.glasses{display:flex;gap:6px;flex-wrap:wrap}
.glass{width:30px;height:38px;border:2px solid var(--accent);border-top-width:0;border-radius:3px 3px 9px 9px;background:none;padding:0;position:relative;overflow:hidden}
.glass.full::after{content:"";position:absolute;inset:30% 0 0;background:var(--accent);opacity:.75}
.fastbar{height:10px;border-radius:10px;background:var(--surface-2);overflow:hidden}
.fastbar i{display:block;height:100%;background:var(--accent);border-radius:10px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px;margin-top:10px}
.week .b{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--muted)}
.week .b i{display:block;width:100%;max-width:26px;border-radius:6px 6px 3px 3px;min-height:3px}
.gear{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.gear svg{width:19px;height:19px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:10px 0}
.danger{color:var(--bad)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:370px){.budget{grid-template-columns:1fr;justify-items:center}.eq{width:100%}}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><i aria-hidden="true"></i>Léger</div>
  <div class="datenav" id="datenav">
    <button data-act="day-prev" aria-label="Jour précédent">‹</button>
    <span id="datelbl">Aujourd'hui</span>
    <button data-act="day-next" aria-label="Jour suivant">›</button>
  </div>
  <div class="hbtns"><button class="gear" data-tab="liens" aria-label="Connexions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>
  <button class="gear" data-tab="profil" aria-label="Objectifs et profil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button></div>
</div></header>

<main class="wrap"><div id="view" class="view"></div></main>

</div></nav>

<script>
(()=>{
'use strict';
/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=(n,d=0)=>Number(n||0).toLocaleString('fr-FR',{maximumFractionDigits:d,minimumFractionDigits:d});
const r0=n=>Math.round(n||0);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d)};
const today=()=>dkey(new Date());
const uid=()=>Math.random().toString(36).slice(2,10);
const num=v=>{if(v==null||v==='')return null;const n=parseFloat(String(v).replace(',','.').replace(/\s/g,''));return isFinite(n)?n:null};
const fmtDate=(k,opt={weekday:'short',day:'numeric',month:'short'})=>parseKey(k).toLocaleDateString('fr-FR',opt);
const inFrame=(()=>{try{return window.top!==window}catch(e){return true}})();
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2800)}

/* ---------- data ---------- */
const KEY='leger.v1';
const MEALS=[['matin','Petit-déjeuner'],['midi','Déjeuner'],['soir','Dîner'],['snack','Collations']];
const ACTS=[ // MET values (Compendium of Physical Activities)
 ['Marche',3.5],['Marche rapide',4.3],['Course à pied',9.8],['Vélo',7.5],['Natation',7],['Musculation',5],['HIIT / Cross-training',8],['Football',7],['Tennis / Padel',7],['Danse',5],['Yoga / Pilates',2.8],['Rameur',7],['Randonnée',6]];
const FOODS=[ // kcal, protéines, glucides, lipides pour 100 g ; portion g ; libellé
 ['Pomme',52,.3,14,.2,150,'1 moyenne'],['Banane',89,1.1,23,.3,120,'1 moyenne'],['Orange',47,.9,12,.1,160,'1 moyenne'],['Fraises',32,.7,7.7,.3,150,'1 bol'],
 ['Flocons d\'avoine',372,13.5,58.7,7,50,'1 portion'],['Pain complet',247,13,41,3.4,40,'1 tranche'],['Baguette',270,9,55,1.2,50,'1/5 de baguette'],['Riz blanc cuit',130,2.7,28,.3,180,'1 assiette'],
 ['Pâtes cuites',158,5.8,31,.9,200,'1 assiette'],['Pomme de terre cuite',86,1.9,20,.1,200,'2 moyennes'],['Patate douce cuite',90,2,21,.2,200,'1 moyenne'],['Quinoa cuit',120,4.4,21,1.9,150,'1 portion'],
 ['Blanc de poulet cuit',165,31,0,3.6,130,'1 filet'],['Steak haché 5 %',125,21,0,5,125,'1 steak'],['Saumon cuit',206,22,0,13,130,'1 pavé'],['Thon au naturel',116,26,0,1,100,'1 boîte égouttée'],
 ['Œuf',143,12.6,.7,9.5,55,'1 œuf'],['Jambon blanc',113,20,1,3.5,40,'1 tranche'],['Tofu',144,15.6,2.3,8.7,100,'1 portion'],['Lentilles cuites',116,9,20,.4,180,'1 portion'],
 ['Yaourt nature',61,3.5,4.7,3.3,125,'1 pot'],['Skyr nature',63,11,4,.2,150,'1 pot'],['Fromage blanc 0 %',46,7.5,4,.1,100,'1 portion'],['Lait demi-écrémé',46,3.3,4.8,1.6,250,'1 verre'],
 ['Emmental',380,28,0,29,30,'1 portion'],['Camembert',299,20,0,24,30,'1 portion'],['Beurre',745,.7,.6,82,10,'1 noisette'],['Huile d\'olive',900,0,0,100,10,'1 c. à soupe'],
 ['Avocat',160,2,8.5,14.7,80,'1/2 avocat'],['Amandes',579,21,22,50,30,'1 poignée'],['Salade verte',15,1.4,2.9,.2,80,'1 bol'],['Brocoli cuit',35,2.4,7,.4,150,'1 portion'],
 ['Haricots verts cuits',31,1.8,7,.1,150,'1 portion'],['Tomate',18,.9,3.9,.2,120,'1 moyenne'],['Carottes râpées',41,.9,10,.2,100,'1 portion'],['Chocolat noir 70 %',598,7.8,46,43,20,'2 carreaux'],
 ['Pizza margherita',250,11,31,9,300,'1/2 pizza'],['Croissant',406,8,45,21,60,'1 croissant'],['Burger classique',254,13,24,12,220,'1 burger'],['Frites',312,3.4,41,15,150,'1 portion moyenne'],
 ['Jus d\'orange',45,.7,10,.2,200,'1 verre'],['Soda sucré',42,0,10.6,0,330,'1 canette'],['Bière blonde',43,.5,3.6,0,250,'1 demi'],['Vin rouge',85,.1,2.6,0,125,'1 verre'],
 ['Café noir',2,.1,0,0,100,'1 tasse'],['Barre protéinée',360,33,35,10,60,'1 barre'],['Whey (poudre)',380,78,8,5,30,'1 dose']
].map(([n,k,p,c,f,g,u])=>({n,k,p,c,f,g,u,src:'base'}));

const blank=()=>({plan:{},v:1,demo:false,profile:null,days:{},weights:[],strava:{},recent:[],sante:{},chat:[],ai:{},fast:null});
let S;
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.v)return Object.assign(blank(),j)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function day(k){return S.days[k]||(S.days[k]={foods:[],acts:[],health:null,water:0})}

function seedDemo(){
  const s=blank();s.demo=true;
  s.profile={sports:['muscu','course','velo'],freq:4,lvl:'int',sex:'h',age:34,height:178,start:88.4,goal:80,rate:0.5,actPct:75,startDate:addDays(today(),-34)};
  for(let i=34;i>=0;i-=1){ if(i%2&&i>3)continue; const kg=88.4-(34-i)*0.075+Math.sin(i*1.7)*0.35; s.weights.push({d:addDays(today(),-i),kg:Math.round(kg*10)/10}) }
  const t=today(),D=s.days[t]={foods:[],acts:[],health:{active:412,steps:7840,src:'exemple'}};
  const add=(meal,name,g)=>{const f=FOODS.find(x=>x.n===name);D.foods.push(foodEntry(meal,f,g))};
  add('matin','Flocons d\'avoine',50);add('matin','Skyr nature',150);add('matin','Banane',120);
  add('midi','Blanc de poulet cuit',130);add('midi','Riz blanc cuit',180);add('midi','Haricots verts cuits',150);add('midi','Huile d\'olive',10);
  add('snack','Amandes',30);
  D.acts.push({id:uid(),src:'strava',sport:'course',name:'Course à pied · 5,4 km',min:32,kcal:356,ext:'demo'});
  [1690,2140,1580,1820,1950,1610].forEach((k,i)=>{s.days[addDays(t,-(i+1))]={foods:[{id:uid(),meal:'midi',name:'Journée d\'exemple',g:0,kcal:k,p:k*.07,c:k*.11,f:k*.035}],acts:[],health:{active:300+i*40},water:1500}});
  [[1,'muscu','Musculation · haut du corps',55,260,'manuel'],[3,'velo','Sortie vélo · 28 km',75,520,'strava'],[4,'muscu','Musculation · bas du corps',60,290,'manuel'],[6,'course','Footing · 6,1 km',38,410,'strava']].forEach(([i,sp,n,m,k,src])=>s.days[addDays(t,-i)]?.acts.push({id:uid(),src,sport:sp,name:n,min:m,kcal:k,ext:src==='strava'?'demo'+i:undefined}));
  D.water=1250;
  return s;
}
function foodEntry(meal,f,g){const q=g/100;return{id:uid(),meal,name:f.n,brand:f.b||'',g,kcal:r0(f.k*q),p:+(f.p*q).toFixed(1),c:+(f.c*q).toFixed(1),f:+(f.f*q).toFixed(1)}}

/* ---------- calculations ---------- */
function curWeight(){const w=[...S.weights].sort((a,b)=>a.d<b.d?-1:1);return w.length?w[w.length-1].kg:(S.profile?.start||75)}
function weightOn(k){const w=S.weights.filter(x=>x.d<=k).sort((a,b)=>a.d<b.d?-1:1);return w.length?w[w.length-1].kg:curWeight()}
function bmr(p,kg){return 10*kg+6.25*p.height-5*p.age+(p.sex==='f'?-161:5)} // Mifflin-St Jeor
function plan(k=today()){
  const p=S.profile;if(!p)return null;
  const kg=weightOn(k),b=bmr(p,kg),base=b*1.2;
  const deficit=p.rate*7700/7;
  const floor=p.sex==='f'?1200:1500;
  const target=Math.max(floor,base-deficit);
  return{kg,bmr:b,base,deficit,target,floor,limited:base-deficit<floor,prot:Math.round(kg*1.6),fat:Math.round(target*.3/9)};
}
function totals(k){
  const D=day(k);const t={kcal:0,p:0,c:0,f:0};D.foods.forEach(x=>{t.kcal+=x.kcal;t.p+=x.p;t.c+=x.c;t.f+=x.f});
  const workouts=D.acts.reduce((a,x)=>a+x.kcal,0);
  const hActive=D.health?.active;
  const active=hActive!=null?Math.max(hActive,workouts):workouts;
  return{...t,workouts,active,steps:D.health?.steps??null,hActive};
}
function metKcal(met,min,kg){return Math.round((met-1)*3.5*kg/200*min)} // nettes (hors métabolisme de base)

/* ---------- state ---------- */
S=load()||seedDemo();
let tab='jour',cur=today();

/* ---------- views ---------- */
function render(){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
  $('#datenav').hidden=tab!=='jour';
  $('#datelbl').textContent=cur===today()?'Aujourd\'hui':cur===addDays(today(),-1)?'Hier':fmtDate(cur);
  $('#view').innerHTML=({jour:vJour,poids:vPoids,liens:vLiens,profil:vProfil,coach:vCoach,plan:vPlan})[tab]();
  if(tab==='profil')bindProfil();
  $('main').classList.toggle('chatmode',tab==='coach');
  const cp=$('#chatform');cp.hidden=tab!=='coach';
  if(tab==='coach')$('#sugg').innerHTML=aiBusy?'<button type="button" class="chip" data-act="chat-stop">■ Arrêter</button>':SUGG.map(q=>`<button type="button" class="chip" data-act="chat-sugg" data-q="${esc(q)}">${esc(q)}</button>`).join('');
  if(tab==='coach')requestAnimationFrame(()=>window.scrollTo(0,document.body.scrollHeight));
  clearInterval(fastTimer);if(tab==='jour'&&S.fast)fastTimer=setInterval(()=>{const e=$('#fastnow');if(e)e.outerHTML=fastCard()},30000);
}
const banner=()=>S.demo?`<div class="banner"><div><b>Données d'exemple</b>Ce sont des chiffres fictifs pour montrer l'app.</div><button class="btn sm" data-act="start">Commencer</button></div>`:'';

function vJour(){
  const P=plan(cur);
  if(!P)return banner()+`<div class="card stack"><h2>Bienvenue</h2><p class="muted" style="margin:0">Renseignez votre profil pour calculer votre budget calorique quotidien.</p><button class="btn" data-tab="profil">Définir mes objectifs</button></div>`;
  const T=totals(cur),p=S.profile;
  const actCount=Math.round(T.active*p.actPct/100);
  const budget=Math.round(P.target+actCount);
  const left=budget-r0(T.kcal);
  const C=2*Math.PI*62,frac=Math.min(1,T.kcal/Math.max(1,budget));
  const D=day(cur);
  const carbs=Math.max(0,Math.round((budget-P.prot*4-P.fat*9)/4));
  const macro=(lbl,v,goal,col)=>`<div class="macro"><b class="small">${lbl}</b><small class="num">${nf(v)} / ${nf(goal)} g</small><div class="bar"><i style="width:${Math.min(100,v/goal*100)}%;background:${col}"></i></div></div>`;
  const meals=MEALS.map(([id,lbl])=>{
    const it=D.foods.filter(f=>f.meal===id);const sum=it.reduce((a,x)=>a+x.kcal,0);
    return`<div class="meal"><div class="meal-h"><h3>${lbl}</h3><span class="k">${sum?nf(sum)+' kcal':''}</span></div>
      ${it.map(f=>`<div class="item"><div class="n"><span>${esc(f.name)}</span><small>${f.g?nf(f.g)+' g':''}${f.brand?' · '+esc(f.brand):''}</small></div><span class="k">${nf(f.kcal)}</span><button class="x" data-act="del-food" data-id="${f.id}" aria-label="Supprimer">×</button></div>`).join('')}
      <button class="addline" data-act="add-food" data-meal="${id}">+ Ajouter</button></div>`}).join('');
  const acts=D.acts.map(a=>`<div class="item"><span class="tag ${a.src}">${({strava:'Strava',sante:'Santé',manuel:'Manuel'})[a.src]}</span><div class="n"><span>${esc(a.name)}</span><small>${a.min?nf(a.min)+' min':''}</small></div><span class="k">${nf(a.kcal)}</span><button class="x" data-act="del-act" data-id="${a.id}" aria-label="Supprimer">×</button></div>`).join('');
  return banner()+`
  <section class="card ${left<0?'over':''}">
    <div class="budget">
      <div class="ring" role="img" aria-label="${nf(Math.abs(left))} kcal ${left<0?'au-dessus du budget':'restantes'}">
        <svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="62" fill="none" stroke="var(--surface-2)" stroke-width="13"/>
        <circle cx="75" cy="75" r="62" fill="none" stroke="${left<0?'var(--bad)':'var(--eat)'}" stroke-width="13" stroke-linecap="round" stroke-dasharray="${C*frac} ${C}"/></svg>
        <div class="c"><span class="big num">${nf(Math.abs(left))}</span><span class="lbl">${left<0?'kcal en trop':'kcal restantes'}</span></div>
      </div>
      <div class="eq">
        <div><span><span class="op"></span>Objectif</span><b>${nf(P.target)}</b></div>
        <div><span><span class="op">−</span><span class="dot" style="background:var(--eat)"></span>Repas</span><b>${nf(T.kcal)}</b></div>
        <div><span><span class="op">+</span><span class="dot" style="background:var(--burn)"></span>Activité${p.actPct<100?` <small class="muted">(${p.actPct} %)</small>`:''}</span><b>${nf(actCount)}</b></div>
        <hr><div><span><span class="op">=</span>Reste</span><b>${nf(left)}</b></div>
      </div>
    </div>
    <div class="macros">${macro('Protéines',T.p,P.prot,'var(--accent)')}${macro('Glucides',T.c,carbs,'var(--eat)')}${macro('Lipides',T.f,P.fat,'var(--warn)')}</div>
  </section>
  <section class="card"><div class="row between"><h2>Repas</h2><span class="muted small num">${nf(T.kcal)} kcal</span></div>${meals}</section>
  <section class="card stack">
    <div class="row between"><h2>Dépense</h2><button class="btn sm alt" data-act="add-act">+ Activité</button></div>
    <div class="stats3">
      <div class="stat"><b>${nf(T.active)}</b><span>kcal actives</span></div>
      <div class="stat"><b>${T.steps!=null?nf(T.steps):'–'}</b><span>pas</span></div>
      <div class="stat"><b>${nf(P.base)}</b><span>kcal au repos</span></div>
    </div>
    ${acts||'<p class="empty">Aucune séance. Ajoutez-en une ou synchronisez Strava.</p>'}
    ${T.hActive!=null&&D.acts.length?`<p class="note">Apple Santé compte déjà vos séances dans l'énergie active : on garde la valeur la plus haute (${nf(T.active)} kcal) pour ne rien compter deux fois.</p>`:''}
  </section>
  ${waterCard()}
  ${cur===today()?fastCard():''}
  <button class="card row" data-tab="coach" style="text-align:left;width:100%;cursor:pointer"><div class="logo" style="background:linear-gradient(135deg,var(--accent),var(--burn));width:38px;height:38px;font-size:15px">?</div><div style="min-width:0"><b>Une question ?</b><div class="small muted">« ${esc(TIPS[new Date().getDate()%TIPS.length])} » Demandez au coach.</div></div></button>`;
}
const TIPS=['Comment récupérer après ma séance ?','Le café fait-il grossir ?','Que manger ce soir avec ce qu\'il me reste ?','Pourquoi mon poids stagne ?','Une collation riche en protéines ?','Le jeûne intermittent, ça marche ?','L\'alcool bloque-t-il la perte de poids ?'];
function waterGoal(){return Math.round(weightOn(cur)*35/250)*250}
function waterCard(){
  const D=day(cur),ml=D.water||0,goal=waterGoal(),n=Math.max(8,Math.ceil(goal/250));
  return`<section class="card stack"><div class="row between"><h2>Hydratation</h2><span class="small muted num">${nf(ml/1000,2)} / ${nf(goal/1000,1)} L</span></div>
    <div class="glasses">${Array.from({length:n},(_,i)=>`<button class="glass ${i<ml/250?'full':''}" data-act="water" data-n="${i+1}" aria-label="${i+1} verre${i?'s':''}"></button>`).join('')}</div>
    <p class="note" style="margin:0">Un verre = 250 ml. Objectif : 35 ml par kilo.</p></section>`;
}
let fastTimer;
function fastCard(){
  const f=S.fast;
  if(!f)return`<section class="card row between" id="fastnow"><div><h2>Jeûne intermittent</h2><span class="small muted">Lancez le chrono après votre dernier repas.</span></div><div class="row"><button class="btn sm alt" data-act="fast-start" data-h="14">14 h</button><button class="btn sm" data-act="fast-start" data-h="16">16 h</button></div></section>`;
  const el=(Date.now()-f.start)/36e5,pct=Math.min(100,el/f.h*100),end=new Date(f.start+f.h*36e5);
  const done=el>=f.h;
  return`<section class="card stack" id="fastnow"><div class="row between"><h2>Jeûne ${f.h}:${24-f.h}</h2><button class="btn sm alt" data-act="fast-stop">${done?'Terminer':'Arrêter'}</button></div>
    <div class="row" style="align-items:baseline;gap:6px"><span class="kcalbig">${Math.floor(el)} h ${pad(Math.floor(el%1*60))}</span><span class="muted small">${done?'objectif atteint':'fin à '+end.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</span></div>
    <div class="fastbar"><i style="width:${pct}%"></i></div></section>`;
}

function vPoids(){
  const p=S.profile;const w=[...S.weights].sort((a,b)=>a.d<b.d?-1:1);
  const now=curWeight(),start=p?.start??(w[0]?.kg||now),goal=p?.goal??now;
  const lost=start-now,total=Math.max(.1,start-goal),pct=Math.max(0,Math.min(100,lost/total*100));
  // trend: linear regression over last 28 days
  let trend=null;const cut=addDays(today(),-28),pts=w.filter(x=>x.d>=cut);
  if(pts.length>=4){const xs=pts.map(x=>(parseKey(x.d)-parseKey(cut))/864e5),ys=pts.map(x=>x.kg);const mx=xs.reduce((a,b)=>a+b)/xs.length,my=ys.reduce((a,b)=>a+b)/ys.length;let nu=0,de=0;xs.forEach((x,i)=>{nu+=(x-mx)*(ys[i]-my);de+=(x-mx)**2});trend=de?nu/de*7:null}
  let eta='';
  if(trend!=null&&trend<-.02&&now>goal){const wk=(now-goal)/-trend;eta=fmtDate(addDays(today(),Math.round(wk*7)),{day:'numeric',month:'long',year:'numeric'})}
  return banner()+`
  <section class="card">
    <div class="row between"><span class="tiny">Poids actuel</span><button class="btn sm" data-act="add-weight">+ Pesée</button></div>
    <div class="row" style="align-items:baseline;gap:6px;margin-top:4px"><span class="kcalbig">${nf(now,1)}</span><span class="muted">kg</span>
      ${trend!=null?`<span class="tag" style="margin-left:auto;${trend<=0?'background:var(--burn-soft);color:var(--burn)':'background:var(--eat-soft);color:var(--eat)'}">${trend>0?'+':''}${nf(trend,2)} kg/sem.</span>`:''}</div>
    <div class="prog"><i style="width:${pct}%"></i></div>
    <div class="row between small muted"><span>Départ ${nf(start,1)} kg</span><span>${nf(pct)} %</span><span>Objectif ${nf(goal,1)} kg</span></div>
  </section>
  <div class="wstats">
    <div class="stat"><b>${lost>=0?'−':'+'}${nf(Math.abs(lost),1)}</b><span>kg depuis le début</span></div>
    <div class="stat"><b>${nf(Math.max(0,now-goal),1)}</b><span>kg restants</span></div>
    <div class="stat"><b>${now&&p?.height?nf(now/((p.height/100)**2),1):'–'}</b><span>IMC</span></div>
  </div>
  <section class="card"><div class="row between"><h2>Courbe</h2><span class="small muted">90 jours · moyenne 7 j</span></div>${chart(w,goal)}
    ${eta?`<p class="note">À ce rythme, objectif atteint vers le <b>${eta}</b>.</p>`:p?`<p class="note">Au rythme prévu de ${nf(p.rate,2)} kg/semaine, comptez environ ${nf(Math.max(0,now-goal)/p.rate)} semaines.</p>`:''}
  </section>

function weekCard(){
  if(!S.profile)return'';
  const days=Array.from({length:7},(_,i)=>addDays(today(),i-6));
  const data=days.map(k=>{const D=S.days[k];const T=D?totals(k):{kcal:0,active:0};const P=plan(k);const b=P.target+T.active*S.profile.actPct/100;return{k,kcal:T.kcal,b,logged:!!(D&&D.foods.length)}});
  const max=Math.max(...data.map(d=>Math.max(d.kcal,d.b)),1);
  const logged=data.filter(d=>d.logged),ok=logged.filter(d=>d.kcal<=d.b).length;
  const avg=logged.length?logged.reduce((a,d)=>a+d.kcal,0)/logged.length:0;
  const bal=logged.reduce((a,d)=>a+(d.b-d.kcal),0);
  let streak=0;for(let i=0;i<400;i++){const D=S.days[addDays(today(),-i)];if(D&&D.foods.length)streak++;else if(i>0)break}
  return`<section class="card"><div class="row between"><h2>Bilan 7 jours</h2><span class="tag">${streak} j de suite</span></div>
    <div class="week">${data.map(d=>`<div class="b"><span class="num">${d.logged?nf(d.kcal/1000,1)+'k':''}</span><i style="height:${Math.max(3,d.kcal/max*90)}px;background:${!d.logged?'var(--surface-2)':d.kcal<=d.b?'var(--burn)':'var(--eat)'}"></i><span>${fmtDate(d.k,{weekday:'narrow'})}</span></div>`).join('')}</div>
    <div class="stats3" style="margin-top:12px"><div class="stat"><b>${ok}/${logged.length||0}</b><span>jours dans le budget</span></div><div class="stat"><b>${nf(avg)}</b><span>kcal / jour</span></div><div class="stat"><b>${bal>=0?'−':'+'}${nf(Math.abs(bal/7700),2)}</b><span>kg estimés</span></div></div></section>`;
}
function chart(w,goal){
  const from=addDays(today(),-90),pts=w.filter(x=>x.d>=from);
  if(pts.length<2)return'<p class="empty">Ajoutez au moins deux pesées pour voir la courbe.</p>';
  const W=340,H=170,L=34,R=8,Tp=10,B=22;
  const t0=parseKey(pts[0].d),t1=parseKey(today()),span=Math.max(1,(t1-t0)/864e5);
  const vals=pts.map(x=>x.kg).concat(goal);let lo=Math.floor(Math.min(...vals)-.5),hi=Math.ceil(Math.max(...vals)+.5);
  const X=k=>L+((parseKey(k)-t0)/864e5)/span*(W-L-R),Y=v=>Tp+(hi-v)/(hi-lo)*(H-Tp-B);
  const step=Math.max(1,Math.ceil((hi-lo)/4));let grid='';
  for(let v=lo;v<=hi;v+=step)grid+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`;
  const avg=pts.map(x=>{const a=addDays(x.d,-6);const s=pts.filter(y=>y.d>=a&&y.d<=x.d);return[x.d,s.reduce((m,y)=>m+y.kg,0)/s.length]});
  const line=avg.map(([d,v],i)=>(i?'L':'M')+X(d).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const area=line+` L${X(avg[avg.length-1][0]).toFixed(1)} ${H-B} L${X(avg[0][0]).toFixed(1)} ${H-B} Z`;
  const last=avg[avg.length-1];
  const lbls=[pts[0].d,today()].map((d,i)=>`<text x="${i?W-R:L}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="${i?'end':'start'}">${fmtDate(d,{day:'numeric',month:'short'})}</text>`).join('');
  return`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe de poids">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    ${goal>=lo&&goal<=hi?`<line x1="${L}" x2="${W-R}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--burn)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${W-R}" y="${Y(goal)-5}" text-anchor="end" font-size="10" font-weight="600" fill="var(--burn)">objectif ${nf(goal,1)}</text>`:''}
    <path d="${area}" fill="url(#ga)"/>
    ${pts.map(x=>`<circle cx="${X(x.d).toFixed(1)}" cy="${Y(x.kg).toFixed(1)}" r="2.4" fill="var(--muted)" opacity=".55"/>`).join('')}
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(last[0])}" cy="${Y(last[1])}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    ${lbls}</svg></div>`;
}

      const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
      for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const parts=buf.split('\n');buf=parts.pop();
        for(const l of parts){if(!l.startsWith('data:'))continue;try{const j=JSON.parse(l.slice(5));if(j.type==='content_block_delta'&&j.delta?.text){text+=j.delta.text;live(text)}}catch(e){}}}
    }
    S.chat.push({r:'a',t:text||'Je n\'ai pas de réponse, reformulez ?'});
  }catch(e){
    const partial=e?.text;
    if(e?.name==='AbortError'||e?.code==='aborted'){if(partial)S.chat.push({r:'a',t:partial})}
    else if(e?.code==='not_granted'){sampleFn=null;S.chat.push({r:'a',t:localAnswer(q),src:'local'})}

 [/abdo|gainage|crunch/i,`Les abdos renforcent la sangle abdominale mais **ne brûlent pas la graisse du ventre** (quelques dizaines de kcal par séance).\n- Pour un ventre plus plat : déficit calorique + musculation globale (squats, tractions, pompes) + marche.\n- Le gainage reste utile pour le dos et la posture.`],
 [/coco|huile de coco/i,`L'huile de coco n'a rien de magique : **900 kcal pour 100 g**, comme les autres huiles, et riche en graisses saturées. À utiliser avec modération, l'huile d'olive ou de colza reste préférable au quotidien.`],
 [/miel|sirop d.agave|sucre de coco|sucre roux/i,`Miel, agave, sucre de coco ou sucre roux : **c'est du sucre**, avec à peu près les mêmes calories (≈ 20 kcal la cuillère à café de sucre, ≈ 60 kcal la cuillère à soupe de miel). Ils ne sont pas plus « minceur », comptez-les pareil.`],
 [/fromage|lait|laitier|yaourt/i,`Les produits laitiers ne font pas grossir en soi et apportent protéines et calcium.\n- Skyr, fromage blanc et yaourt nature : excellents rapports protéines/calories.\n- Le fromage est dense (≈ 100 à 120 kcal pour 30 g) : une portion par jour, pesée au début pour calibrer l'œil.`],
 [/resto|restaurant|fast.food|mcdo|burger|kebab|pizza|sushi/i,`Vous pouvez manger dehors en perdant du poids, il suffit de l'anticiper.\n- Repérez votre budget restant dans Journée et allégez le repas d'avant.\n- Choix malins : grillades, poke, sushis (sans tempura), pizza partagée avec une salade.\n- Les pièges : sauces, frites, boissons sucrées et alcool. Un menu burger-frites-soda ≈ 1 100 kcal.\n- Notez-le avec la saisie rapide en estimant large.`],
 [/stress|cortisol|anxi/i,`Le stress chronique augmente l'appétit pour le sucré et le gras, et perturbe le sommeil. Le cortisol en lui-même ne crée pas de graisse sans surplus de calories.\n- Marche, sport, respiration lente et sommeil sont les meilleurs leviers.\n- Prévoyez des collations rassasiantes plutôt que de compter sur la volonté.`],
 [/r[eè]gles|cycle|menstru/i,`Avant et pendant les règles, la rétention d'eau fait souvent prendre **0,5 à 2 kg** sur la balance : ce n'est pas de la graisse.\n- Comparez votre poids d'un cycle à l'autre plutôt que semaine par semaine.\n- Les envies sont normales : gardez une petite marge dans le budget ces jours-là.`],
 [/c[eé]leri|calories? n[eé]gative/i,`Les « aliments à calories négatives » sont un mythe : la digestion consomme environ 10 % des calories d'un aliment, jamais plus que ce qu'il apporte. Le céleri reste très peu calorique (≈ 15 kcal/100 g), donc idéal pour le volume.`],
 [/transpir|sauna|k-way|sudation/i,`Transpirer fait perdre de l'eau, pas de la graisse : le poids revient dès que vous buvez. Ce qui compte, c'est l'énergie dépensée, pas la sueur.`],
 [/m[eé]tabolisme|5 repas|petits repas|grignoter souvent/i,`Manger 3 ou 6 fois par jour **ne change pas le métabolisme** : à calories égales, le résultat est le même. Choisissez le rythme qui vous aide à avoir moins faim.`],
 [/caf[eé]|expresso|cappuccino|latte/i,`**Le café noir ne fait pas grossir** : environ 2 kcal la tasse. Il peut même aider un peu (la caféine augmente légèrement la dépense et coupe la faim).\n- Ce qui compte, c'est ce qu'on ajoute : un sucre ≈ 20 kcal, un latte au lait entier ≈ 150 à 250 kcal, un frappuccino peut dépasser 400 kcal.\n- Évitez-le après 14 h si votre sommeil en pâtit : mal dormir augmente la faim le lendemain.\n- Jusqu'à 3 à 4 tasses par jour, c'est sans risque pour la plupart des adultes.`],
 [/alcool|vin|bi[eè]re|ap[eé]ro|cocktail|whisky|vodka/i,`L'alcool apporte **7 kcal par gramme**, presque autant que le gras : un verre de vin ≈ 85 kcal, une pinte ≈ 200 kcal, un cocktail ≈ 200 à 300 kcal.\n- Le corps le brûle en priorité, ce qui met la combustion des graisses en pause.\n- Il désinhibe : on mange souvent plus en apéro.\n- Si vous buvez, comptez-le dans le budget, alternez avec de l'eau et préférez vin sec ou bière légère.`],
 [/\bsucres?\b|sucr[eé]|bonbon|dessert|g[aâ]teau|chocolat/i,`Le sucre ne fait pas grossir « en soi », c'est le **total de calories** qui compte. Mais les produits sucrés sont peu rassasiants et faciles à surconsommer.\n- Gardez un petit plaisir planifié (2 carreaux de chocolat noir ≈ 120 kcal) plutôt que de tout interdire.\n- Associez-le à un repas, pas seul en collation.\n- Les boissons sucrées sont la pire source : 1 canette ≈ 140 kcal sans aucune satiété.`],
 [/fruit|banane|\bpommes?\b(?! de terre)|raisin/i,`Les fruits sont des alliés : riches en eau et en fibres, ils rassasient pour peu de calories (une pomme ≈ 80 kcal, une banane ≈ 105 kcal).\n- 2 à 3 portions par jour, entiers plutôt qu'en jus (le jus perd les fibres).\n- Les fruits secs sont beaucoup plus denses : une poignée de raisins secs ≈ 130 kcal.`],
 [/soir|tard|apr[eè]s 20|nuit|d[iî]ner/i,`Manger le soir **ne fait pas grossir en soi** : c'est le bilan de la journée qui compte.\n- Le vrai piège, c'est le grignotage devant un écran et le manque de sommeil.\n- Un dîner riche en protéines et légumes (poisson + légumes + un peu de féculents) rassasie bien.\n- Si vous avez faim tard, gardez 150 à 200 kcal pour un skyr ou un fruit.`],
 [/pain|p[aâ]tes|riz|f[eé]culent|glucide|carb|pommes? de terre|patate|frites|quinoa|semoule/i,`Les glucides ne sont pas l'ennemi. Riz, pâtes ou pain complet fournissent l'énergie pour vos séances.\n- Surveillez surtout les **portions** : 200 g de pâtes cuites ≈ 320 kcal, c'est vite doublé.\n- Préférez les versions complètes, plus rassasiantes.\n- Dosez-les selon l'activité : plus les jours de sport, moins les jours calmes.`],
 [/gras|huile|beurre|lipide|avocat|noix|amande/i,`Les lipides sont indispensables (hormones, vitamines), mais très caloriques : **9 kcal par gramme**. Une cuillère d'huile ≈ 90 kcal, une poignée d'amandes ≈ 170 kcal.\n- Visez environ 30 % de vos calories.\n- Mesurez l'huile à la cuillère plutôt qu'à l'œil : c'est la source d'erreur numéro 1.`],
 [/prot[eé]in|whey|viande|poulet|œuf|oeuf|skyr/i,`Les protéines sont votre meilleur outil : elles **rassasient le plus** et protègent vos muscles pendant le régime.\n- Visez environ 1,6 g par kilo (votre cible est affichée sur la journée).\n- En mettre à chaque repas : œufs, skyr, poulet, poisson, tofu, légumineuses.\n- La whey est pratique mais pas obligatoire.`],
 [/\b(boire|hydrat\w*|soif)\b|(^|[^\w])eau(?! de coco)\b/i,`Bien boire aide : on confond souvent soif et faim, et un grand verre d'eau avant le repas réduit un peu ce qu'on mange.\n- Comptez environ 35 ml par kilo, plus si vous transpirez.\n- Thé et café comptent aussi, pas les sodas.\n- Suivez vos verres dans la carte Hydratation.`],
 [/stagn|plateau|bloqu|bouge pas|remonte|pris du poids/i,`Un plateau est normal. Le poids varie de **1 à 2 kg d'un jour à l'autre** (eau, sel, glucides, transit, cycle).\n- Regardez la moyenne sur 7 jours dans l'onglet Poids, pas la pesée du jour.\n- Si la moyenne ne bouge plus depuis 3 semaines : vérifiez les portions (huile, sauces, boissons) et l'activité réelle.\n- En perdant du poids, vos besoins baissent : mettez votre poids à jour pour recalculer le budget.`],
 [/sport|muscu|cardio|courir|course|v[eé]lo|marche|pas\b/i,`L'alimentation fait l'essentiel de la perte, le sport aide à garder le muscle et le moral.\n- **Musculation 2 à 3 fois par semaine** : elle préserve la masse musculaire.\n- Le cardio augmente la dépense ; la marche (8 000 à 10 000 pas) est sous-estimée et facile à tenir.\n- Les montres surestiment souvent les calories brûlées : c'est pour ça que l'app n'en compte qu'une partie.`],
 [/sommeil|dormir|fatigu/i,`Le sommeil compte vraiment : après une nuit courte, l'hormone de la faim (ghréline) augmente et on mange en moyenne **300 kcal de plus**.\n- Visez 7 à 9 h.\n- Pas d'écran ni de café tardif, chambre fraîche.`],
 [/je[uû]ne|16[:/]8|sauter un repas/i,`Le jeûne intermittent marche **autant qu'un régime classique, pas mieux** : il aide surtout parce qu'il réduit la fenêtre où l'on mange.\n- Si ça vous convient (16:8 par exemple), utilisez le chrono sur la journée.\n- Gardez assez de protéines dans la fenêtre de repas.\n- Déconseillé en cas d'antécédents de troubles alimentaires, de diabète traité ou de grossesse.`],
 [/[eé]dulcorant|light|z[eé]ro|aspartame|stevia/i,`Les boissons « zéro » apportent ~0 kcal et peuvent aider à remplacer les sodas sucrés. Les études ne montrent pas qu'elles font grossir.\n- Idéalement, l'eau reste la boisson de base.\n- Les produits « light » ne sont pas toujours moins caloriques : regardez les kcal pour 100 g.`],
 [/craqu|tri(ch|che)|excès|exc[eè]s|fringale|faim|grignot/i,`Un écart ne ruine rien : pour stocker 1 kg de graisse, il faut un excédent d'environ **7 700 kcal**.\n- Notez-le quand même, sans culpabiliser, et reprenez normalement au repas suivant (pas de compensation extrême).\n- Contre les fringales : protéines et fibres à chaque repas, eau, et une collation prévue (fruit + skyr).`],
 [/combien|vite|rapide|semaine|kilo par/i,`Un rythme durable est de **0,5 à 1 % du poids par semaine**, soit environ 0,5 kg pour la plupart des gens.\n- Plus vite, on perd davantage de muscle et on reprend plus facilement.\n- Les premières semaines vont souvent plus vite (perte d'eau), c'est normal.`],
 [/sel|r[eé]tention|gonfl/i,`Un repas salé fait souvent monter la balance de 0,5 à 1 kg le lendemain : **c'est de l'eau**, pas de la graisse. Elle repart en 1 à 3 jours. Buvez normalement et regardez la tendance sur 7 jours.`],
 [/petit[- ]d[eé]j|matin/i,`Sauter ou non le petit-déjeuner ne change pas le résultat, c'est le total de la journée qui compte.\n- Si vous en prenez un, misez sur les protéines (skyr, œufs) + fibres (flocons d'avoine, fruit) : il cale jusqu'au midi.\n- Évitez la combinaison viennoiserie + jus, très calorique et peu rassasiante.`],
];
function localAnswer(q){
  const hit=FAQ.find(([re])=>re.test(q));
  if(/(manger|repas).*(soir|ce soir|maintenant)|que manger|quoi manger|id[eé]e/i.test(q)&&S.profile){
    const P=plan(),T=totals(today()),left=Math.round(P.target+T.active*S.profile.actPct/100-T.kcal),pl=Math.max(0,Math.round(P.prot-T.p));
    return`Il vous reste **${nf(left)} kcal** et environ **${nf(pl)} g de protéines** à prendre aujourd'hui.\n${left<250?'- Budget presque épuisé : un skyr (95 kcal) ou un bol de légumes avec un œuf.':left<600?'- Filet de poulet ou poisson (≈ 200 kcal) + légumes à volonté + une cuillère d\'huile.\n- Ou une omelette de 2 œufs + salade + une tranche de pain complet.':'- Saumon (≈ 270 kcal) + riz (≈ 230 kcal) + légumes.\n- Ou pâtes complètes, sauce tomate et thon : ≈ 550 kcal et 35 g de protéines.'}`;
  }
  if(hit)return hit[1];
  if(/c.est vrai|il para[iî]t|apparemment|on m.a dit|fait maigrir|br[uû]le|magique|miracle/i.test(q))return`Méfiez-vous des aliments ou astuces qui « font maigrir » : **aucun aliment ne brûle la graisse** à lui seul, et on ne peut pas cibler une zone du corps. Ce qui fait maigrir, c'est un déficit calorique tenu dans le temps, avec assez de protéines.\nPour une réponse précise sur ce sujet, activez les réponses IA juste au-dessus.`;
  return`Je n'ai pas de réponse toute prête à cette question. Hors ligne, je connais les grandes questions : café, alcool, sucre, fruits, féculents, gras, protéines, eau, plateau, sport, sommeil, jeûne, régimes, mythes minceur, restaurant, écarts…\nPour répondre à **tout**, comme une vraie conversation, activez les réponses IA en haut de cet écran.`;
}

let sheetCtx={};
function openSheet(html,ctx={}){sheetCtx=ctx;$('#sheetbody').innerHTML=html;$('#sheet').classList.add('open');$('#scrim').classList.add('open');setTimeout(()=>{const a=$('#sheetbody [autofocus]');if(a)a.focus()},280)}
function closeSheet(){$('#sheet').classList.remove('open');$('#scrim').classList.remove('open')}
const sheetHead=t=>`<div class="sheet-h"><h2>${t}</h2><button class="x" data-act="close" aria-label="Fermer">×</button></div>`;
function defaultMeal(){const h=new Date().getHours();return h<10.5?'matin':h<15?'midi':h<18?'snack':'soir'}

  <button class="btn acc block" data-act="scan-open">Analyser un repas (photo ou texte)</button>

  <button class="btn alt block" data-act="add-act">Une activité</button>
  <button class="btn alt block" data-act="add-weight">Une pesée</button></div>`)}

/* ---------- analyse de repas (photo / description) ---------- */
const CAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const PEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>';
function scanButtons(){return`<div class="scanbtns">
  <label class="scanbtn" for="mealphoto">${CAM}Photo du plat<small>l'IA détecte tout</small></label>

  <input type="file" id="mealphoto" accept="image/*" capture="environment" hidden>`}
function sheetScan(){openSheet(sheetHead('Analyser un repas')+mealChips(sheetCtx.meal||defaultMeal())+scanButtons()+`<p class="note" style="margin:0">Vous pourrez corriger chaque aliment et chaque quantité avant d'ajouter le repas.</p>`,{meal:sheetCtx.meal||defaultMeal()})}
function mealChips(meal){return`<div class="chips" id="mealchips">${MEALS.map(([id,l])=>`<button class="chip" data-meal-pick="${id}" aria-pressed="${id===meal}">${l}</button>`).join('')}</div>`}
function sheetDescribe(){
  const meal=sheetCtx.meal||defaultMeal();
  openSheet(sheetHead('Décrire le repas')+mealChips(meal)+`<textarea class="i" id="mealtxt" style="font-family:var(--body);font-size:16px" placeholder="Ex. : 2 œufs brouillés, 1 tranche de pain complet avec du beurre, un café au lait" autofocus></textarea>
    <button class="btn block" data-act="scan-run-text">Analyser</button>
    <p class="note" style="margin:0">${aiMode()==='local'?'Sans IA, seuls les aliments de la base intégrée sont reconnus. Activez l\'IA dans l\'onglet Coach pour tout reconnaître, photos comprises.':'L\'IA estime les quantités et les calories.'}</p>`,{meal});
}
function shrinkImage(file,max=1024){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('Image illisible')),'image/jpeg',.82)};img.onerror=()=>rej(new Error('Image illisible'));img.src=url})}
const blobB64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(',')[1]);f.readAsDataURL(b)});
const SCAN_PROMPT=`Tu es nutritionniste. Analyse ce repas et liste chaque aliment ou ingrédient séparément (y compris huile, beurre, sauce, boisson si visibles ou mentionnés). Estime la quantité en grammes (ou ml) et les valeurs nutritionnelles pour CETTE quantité, avec des valeurs réalistes de tables françaises (Ciqual). Si une quantité est donnée par l'utilisateur, respecte-la.
Réponds UNIQUEMENT avec du JSON valide, sans texte autour, de la forme :
{"plat":"nom court du plat","items":[{"nom":"Riz basmati cuit","g":180,"kcal":234,"p":4.9,"c":51,"f":0.5}],"confiance":"faible|moyenne|bonne","note":"une phrase utile, par ex. ce qui est incertain"}
Noms d'aliments en français, courts.`;
function parseJSONLoose(t){if(typeof t!=='string')return t;const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)throw new Error('Réponse illisible');return JSON.parse(t.slice(a,b+1))}
async function aiAnalyze({text,blob}){
  const prompt=SCAN_PROMPT+(text?'\n\nDescription de l\'utilisateur : '+text:'\n\nLa photo jointe montre le repas.');
  if(aiMode()==='claude'){
    const opt={modelTier:blob?'default':'quick',cache:false};
    if(blob){const lim=await sampleFn.limits().catch(()=>null);if(!lim?.images)throw new Error('L\'envoi de photos n\'est pas disponible ici. Décrivez le repas en texte.');opt.images=[blob]}
    const r=await sampleFn(prompt,opt);return parseJSONLoose(r.text);
  }
  if(aiMode()==='key'){
    const content=[];if(blob)content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:await blobB64(blob)}});content.push({type:'text',text:prompt});
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.ai.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:AI_MODEL,max_tokens:1200,messages:[{role:'user',content}]})});
    if(!r.ok)throw new Error(r.status===401?'Clé API refusée : vérifiez-la dans l\'onglet Coach.':'Analyse indisponible ('+r.status+').');
    const j=await r.json();return parseJSONLoose((j.content||[]).map(c=>c.text||'').join(''));
  }
  throw new Error('local');
}
function localParse(text){
  const norm=x=>x.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/œ/g,'oe');
  const parts=text.split(/,|;|\n|\+|\bet\b|\bavec\b/i).map(x=>x.trim()).filter(Boolean);const items=[];
  const NUMW={un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,demi:.5,'1/2':.5};
  parts.forEach(pt=>{const n=norm(pt);
    let best=null,bs=0;FOODS.forEach(f=>{const words=norm(f.n).split(/[^a-z0-9]+/).filter(w=>w.length>2);const sc=words.filter(w=>n.includes(w.replace(/s$/,''))).length/words.length;if(sc>bs){bs=sc;best=f}});
    const mg=n.match(/(\d+(?:[.,]\d+)?)\s*(g|gr|grammes?|ml|cl)\b/);const mc=n.match(/^(\d+(?:[.,]\d+)?)\b/)||n.match(/\b(un|une|deux|trois|quatre|cinq|demi)\b/);
    if(best&&bs>=.5){let g=best.g;if(mg){g=num(mg[1])*(mg[2]==='cl'?10:1)}else if(mc){g=best.g*(NUMW[mc[1]]??num(mc[1]))}
      const q=g/100;items.push({nom:best.n,g:Math.round(g),kcal:r0(best.k*q),p:+(best.p*q).toFixed(1),c:+(best.c*q).toFixed(1),f:+(best.f*q).toFixed(1)})}
    else{const nm=pt.replace(/^(un|une|des|du|de la|de l'|le|la|les)\s+/i,'');items.push({nom:nm.charAt(0).toUpperCase()+nm.slice(1),g:mg?Math.round(num(mg[1])):100,kcal:0,p:0,c:0,f:0,unk:true})}});
  return{plat:'Repas',items,confiance:items.some(i=>i.unk)?'faible':'moyenne',note:items.some(i=>i.unk)?'Certains aliments ne sont pas dans la base : complétez leurs calories.':''};
}
async function runScan({text,file}){
  const meal=sheetCtx.meal||defaultMeal();let blob=null,photo='';
  if(file){
    if(aiMode()==='local'){openSheet(sheetHead('Photo du plat')+`<p>Pour reconnaître un plat en photo, il faut activer les réponses IA (onglet Coach, 3 minutes). En attendant, décrivez le repas en texte.</p><button class="btn block" data-act="scan-text">Décrire le repas</button><button class="btn alt block" data-tab="coach">Activer l'IA</button>`,{meal});return}
    try{blob=await shrinkImage(file)}catch(e){return toast(e.message)}photo=URL.createObjectURL(blob);
  }
  openSheet(sheetHead('Analyse en cours')+(photo?`<img class="photo" src="${photo}" alt="">`:'')+`<div class="row"><span class="spin"></span><span class="muted">Je repère les aliments et estime les quantités…</span></div>`,{meal});
  let res;
  try{res=aiMode()==='local'?localParse(text):await aiAnalyze({text,blob})}
  catch(e){
    if(text&&(e.message==='local'||e instanceof TypeError)){res=localParse(text)}
    else{openSheet(sheetHead('Analyse impossible')+`<p>${esc(e?.code==='not_granted'?'Autorisation refusée pour utiliser Claude.':e?.message||'Erreur inconnue')}</p><button class="btn block" data-act="scan-text">Décrire le repas</button>`,{meal});return}
  }
  const items=(res.items||[]).map(i=>({name:String(i.nom||i.name||'Aliment'),g:Math.max(0,+i.g||0),kcal:Math.max(0,+i.kcal||0),p:+i.p||0,c:+i.c||0,f:+i.f||0,unk:!!i.unk}));
  items.forEach(i=>{i.base=(i.g>0&&i.kcal>0&&!i.unk)?{g:i.g,kcal:i.kcal,p:i.p,c:i.c,f:i.f}:null});
  sheetReview({plat:res.plat||'Repas',items,conf:res.confiance,note:res.note,photo,meal});
}
function sheetReview(st){
  sheetCtx={...sheetCtx,review:st,meal:st.meal};
  const tot=st.items.reduce((a,i)=>(a.k+=i.kcal,a.p+=i.p,a.c+=i.c,a.f+=i.f,a),{k:0,p:0,c:0,f:0});
  const confCol={bonne:'background:var(--burn-soft);color:var(--burn)',moyenne:'background:var(--accent-soft);color:var(--accent)',faible:'background:var(--eat-soft);color:var(--eat)'}[st.conf]||'';
  openSheet(sheetHead('Vérifiez le repas')+(st.photo?`<img class="photo" src="${st.photo}" alt="">`:'')+`

async function showResults(q){
  const box=$('#fres');if(!box)return;q=q.trim();

  const local=q?FOODS.filter(f=>norm(f.n).includes(norm(q))):[];
  const rec=!q?S.recent.slice(0,8):[];

  const row=(f,i)=>`<button class="res" data-act="pick-food" data-i="${i}"><div class="n"><span>${esc(f.n)}</span><small>${f.b?esc(f.b)+' · ':''}${nf(f.k)} kcal / 100 g${f.src==='off'?' · Open Food Facts':''}</small></div><span class="k">${nf(f.k*f.g/100)}</span></button>`;
  const head=t=>`<p class="tiny" style="margin:8px 0 2px">${t}</p>`;
  let html=(rec.length?head('Récents'):'')+(!q&&!rec.length?head('Suggestions'):'')+sheetCtx.list.map(row).join('');
  if(!q&&!rec.length){sheetCtx.list=FOODS.slice(0,8);html=head('Suggestions')+sheetCtx.list.map(row).join('')}
  if(q.length>=3)html+=`<p class="tiny" id="offh" style="margin:12px 0 2px">Open Food Facts · recherche…</p>`;
  box.innerHTML=html||'<p class="empty">Rien dans la base intégrée.</p>';
  if(q.length<3)return;
  const seq=++searchSeq;
  try{
    const isCode=/^\d{8,14}$/.test(q);
    const url=isCode?`https://world.openfoodfacts.org/api/v2/product/${q}.json?fields=code,product_name,product_name_fr,brands,nutriments,serving_quantity`
      :`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=15&lc=fr&fields=code,product_name,product_name_fr,brands,nutriments,serving_quantity`;
    const ctl=new AbortController();setTimeout(()=>ctl.abort(),9000);
    const r=await fetch(url,{signal:ctl.signal});const j=await r.json();
    if(seq!==searchSeq)return;
    const prods=(isCode?(j.product?[j.product]:[]):(j.products||[])).map(p=>{const n=p.nutriments||{};const k=n['energy-kcal_100g']??(n.energy_100g?n.energy_100g/4.184:null);
      return k==null?null:{n:p.product_name_fr||p.product_name||'Produit '+p.code,b:(p.brands||'').split(',')[0],k:+k,p:+(n.proteins_100g||0),c:+(n.carbohydrates_100g||0),f:+(n.fat_100g||0),g:+(p.serving_quantity)||100,u:p.serving_quantity?'1 portion':'100 g',src:'off'}}).filter(Boolean);
    const base=sheetCtx.list.length;sheetCtx.list.push(...prods);
    const h=$('#offh');if(!h)return;
    h.textContent=prods.length?'Open Food Facts':'Open Food Facts · aucun résultat';
    h.insertAdjacentHTML('afterend',prods.map((f,i)=>row(f,base+i)).join(''));
  }catch(e){if(seq!==searchSeq)return;const h=$('#offh');if(h)h.textContent='Open Food Facts injoignable ici (fonctionne dans l\'app installée)'}
}

/* ---------- integrations: Apple Santé ---------- */
function parseHealthText(txt){
  txt=String(txt||'').trim();if(!txt)throw new Error('Presse-papiers vide');
  let o={};
  try{const j=JSON.parse(txt);o=Array.isArray(j)?j:[j]}catch(e){
    const pick=re=>{const m=txt.match(re);return m?num(m[1]):null};
    o=[{date:(txt.match(/date\s*[:=]\s*(\d{4}-\d{2}-\d{2})/i)||[])[1],actif:pick(/(?:actif|active|énergie active)\s*[:=]\s*([\d.,\s]+)/i),pas:pick(/(?:pas|steps)\s*[:=]\s*([\d.,\s]+)/i),poids:pick(/(?:poids|weight)\s*[:=]\s*([\d.,]+)/i)}];
  }
  let n=0;
  o.forEach(r=>{const g=(...k)=>{for(const x of k)if(r[x]!=null&&r[x]!=='')return num(r[x]);return null};
    const d=/^\d{4}-\d{2}-\d{2}/.test(r.date||'')?r.date.slice(0,10):today();
    const a=g('actif','active','activeEnergy','energie'),s=g('pas','steps'),w=g('poids','weight');
    if(a==null&&s==null&&w==null)return;
    const D=day(d);D.health=Object.assign({},D.health,a!=null?{active:r0(a)}:{},s!=null?{steps:r0(s)}:{},{src:'raccourci'});
    if(w&&w>25&&w<350)upsertWeight(d,Math.round(w*10)/10,'sante');n++});
  if(!n)throw new Error('Aucune valeur reconnue (actif, pas, poids)');
  S.sante.last=Date.now();S.sante.info='Raccourci';leaveDemo();save();return n;
}
async function santePaste(){
  // Installed PWA: clipboard read works after a tap (iOS shows a « Coller » bubble). Otherwise fall back to a paste box.
  try{if(navigator.clipboard?.readText){const t=await navigator.clipboard.readText();parseHealthText(t);toast('Santé importée');cur=today();tab='jour';render();return}}catch(e){if(e.message&&!/denied|not allowed|permission|NotAllowed/i.test(e.message+e.name))return toast(e.message)}
  sheetPaste('Importer depuis le Raccourci','Touchez la zone, puis « Coller ».',t=>{parseHealthText(t);toast('Santé importée');cur=today();tab='jour';render()});
}
async function importHealthXML(file){
  const prog=$('#xmlprog');const cutoff=addDays(today(),-120);
  const agg={a:{},s:{},c:{}},wt={};
  const re=/<Record type="HKQuantityTypeIdentifier(BodyMass|ActiveEnergyBurned|StepCount|DietaryEnergyConsumed)"([^>]*)>/g;
  const at=(s,k)=>{const m=s.match(new RegExp(k+'="([^"]*)"'));return m?m[1]:''};
  const reader=file.stream().getReader(),dec=new TextDecoder();let buf='',read=0,tick=0;
  for(;;){const{done,value}=await reader.read();if(done)break;read+=value.length;buf+=dec.decode(value,{stream:true});
    let m,last=0;re.lastIndex=0;
    while((m=re.exec(buf))){last=re.lastIndex;const a=m[2],d=at(a,'startDate').slice(0,10);if(d<cutoff)continue;
      const v=parseFloat(at(a,'value'));if(!isFinite(v))continue;const unit=at(a,'unit'),src=at(a,'sourceName')||'?';
      if(m[1]==='BodyMass'){wt[d]=unit==='lb'?v*.4536:v}
      else{const t=m[1]==='StepCount'?'s':m[1]==='ActiveEnergyBurned'?'a':'c';const val=unit==='kJ'?v/4.184:v;((agg[t][d]||(agg[t][d]={}))[src]=(agg[t][d][src]||0)+val)}}
    const p=buf.lastIndexOf('<Record');buf=p>=last?buf.slice(p):buf.slice(Math.max(last,buf.length-300));
    if(++tick%40===0&&prog)prog.textContent=`Lecture… ${Math.round(read/file.size*100)} %`;
  }
  const best=o=>Math.max(...Object.values(o)); // iPhone + montre comptent tous les deux : on garde la source la plus complète
  const days=new Set([...Object.keys(agg.a),...Object.keys(agg.s)]);
  days.forEach(d=>{const D=day(d);D.health=Object.assign({},D.health,agg.a[d]?{active:r0(best(agg.a[d]))}:{},agg.s[d]?{steps:r0(best(agg.s[d]))}:{},{src:'export'})});
  Object.entries(wt).forEach(([d,kg])=>upsertWeight(d,Math.round(kg*10)/10,'sante'));
  S.sante.last=Date.now();S.sante.info=`${days.size} jours, ${Object.keys(wt).length} pesées`;leaveDemo();save();
  if(prog)prog.textContent='';toast(`Import terminé : ${S.sante.info}`);render();
}
function upsertWeight(d,kg,src){S.weights=S.weights.filter(x=>x.d!==d);S.weights.push({d,kg,src});S.weights.sort((a,b)=>a.d<b.d?-1:1)}

  'pl-check':b=>{const d=b.dataset.d,it=(S.plan[d]||[]).find(x=>x.id===b.dataset.id);if(!it)return;const sp=sportById(it.sport);leaveDemo();
    day(d).acts.push({id:uid(),src:'manuel',sport:sp.id,name:sp.n+(it.note?' · '+it.note:''),min:it.min,kcal:metKcal(sp.met,it.min,weightOn(d)),plan:it.id});save();render();toast('Bravo, séance enregistrée')},
  'pl-gen':()=>{if(!S.profile?.sports?.length){tab='profil';render();return toast('Choisissez d\'abord vos sports dans le profil')}generateWeek(planWeek);save();render();toast('Semaine planifiée')},
  'pl-ask':b=>{tab='coach';render();askCoach(b.dataset.q)},
  'del-act':b=>{const D=day(cur);D.acts=D.acts.filter(x=>x.id!==b.dataset.id);save();render()},
  'add-weight':sheetWeight,
  'confirm-weight':()=>{const kg=num($('#wk').value),d=$('#wd').value||today();if(!kg||kg<25||kg>350)return toast('Poids invalide');leaveDemo();upsertWeight(d,kg);save();closeSheet();tab='poids';render();toast('Pesée enregistrée')},
  'del-weight':b=>{S.weights=S.weights.filter(x=>x.d!==b.dataset.d);save();render()},
  'sante-paste':santePaste,
  'paste-ok':()=>{try{sheetCtx.onDone($('#pastebox').value);closeSheet()}catch(e){toast(e.message)}},
  'strava-go':()=>{const id=$('#st-id').value.trim(),sec=$('#st-secret').value.trim();if(!/^\d+$/.test(id)||!sec)return toast('Renseignez le Client ID et le Client Secret');
    S.strava.id=id;S.strava.secret=sec;save();const url=stravaAuthURL();
    if(!inFrame){location.href=url;return}
    $('#stlink').innerHTML=`<a class="btn strava block" href="${esc(url)}" target="_blank" rel="noopener">Ouvrir Strava pour autoriser</a><p class="note">Strava vous renverra vers une page « localhost » qui ne s'affiche pas : c'est normal, copiez son adresse et collez-la ci-dessous.</p>`},
  'strava-code':async()=>{const v=$('#st-code').value.trim();let code=v;try{code=new URL(v).searchParams.get('code')||v}catch(e){}
    if(!code)return toast('Collez l\'adresse ou le code');const id=$('#st-id').value.trim(),sec=$('#st-secret').value.trim();if(id)S.strava.id=id;if(sec)S.strava.secret=sec;
    try{toast('Connexion à Strava…');await stravaToken({code,grant_type:'authorization_code'});const n=await stravaSync();render();toast(`Strava connecté · ${n} séances`)}catch(e){toast(e.name==='TypeError'?'Strava injoignable depuis cet aperçu : utilisez l\'app installée':e.message)}},
  'strava-sync':async()=>{try{toast('Synchronisation…');const n=await stravaSync();leaveDemo();render();toast(`${n} séances Strava à jour`)}catch(e){toast(e.name==='TypeError'?'Strava injoignable ici':e.message)}},
  'strava-off':()=>{const id=S.strava.id;S.strava={id};save();render();toast('Strava déconnecté')},
  'perm-notif':async()=>{try{const r=await Notification.requestPermission();if(r==='granted')new Notification('Léger',{body:'Les rappels sont activés.'});render()}catch(e){toast('Notifications indisponibles ici')}},
  'perm-store':async()=>{try{const ok=await navigator.storage?.persist?.();$('#persist-lbl').textContent=ok?'Accordé : vos données sont protégées':'Refusé par le navigateur (installez l\'app)'}catch(e){toast('Indisponible ici')}},
  'export':async()=>{const txt=JSON.stringify(S);
    if(!inFrame){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download='leger-sauvegarde-'+today()+'.json';a.click();return toast('Sauvegarde téléchargée')}catch(e){}}
    try{await navigator.clipboard.writeText(txt);toast('Sauvegarde copiée : collez-la dans Notes')}catch(e){sheetPaste('Sauvegarde','Copiez ce texte et gardez-le dans Notes.',()=>{});$('#pastebox').value=txt;$('#pastebox').select()}},
  'import':()=>sheetPaste('Restaurer une sauvegarde','Collez le texte de sauvegarde.',t=>{const j=JSON.parse(t);if(!j.v)throw new Error('Sauvegarde invalide');S=Object.assign(blank(),j);save();render();toast('Sauvegarde restaurée')}),
  'reset':()=>{$('#resetzone').innerHTML=`<div class="row" style="flex-wrap:wrap"><span class="small danger">Effacer toutes les données de ce téléphone ?</span><button class="btn sm" style="background:var(--bad);color:#fff" data-act="reset-ok">Oui, tout effacer</button></div>`},
  'chat-send':()=>{const i=$('#chatin');const v=i.value;i.value='';askCoach(v)},
  'chat-sugg':b=>askCoach(b.dataset.q),
  'chat-stop':()=>aiBusy?.abort(),
  'chat-clear':()=>{S.chat=[];save();render()},
  'ai-save':async()=>{const k=$('#ai-key').value.trim();
    if(k&&!/^sk-ant-/.test(k))return toast('Cette clé ne ressemble pas à une clé Anthropic (sk-ant-…)');
    if(!k){S.ai.key='';save();render();return toast('Clé supprimée')}
    toast('Vérification de la clé…');
    try{const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:AI_MODEL,max_tokens:5,messages:[{role:'user',content:'ok'}]})});
      if(r.status===401||r.status===403)return toast('Clé refusée par Anthropic, vérifiez-la');
      if(r.status===400){const j=await r.json().catch(()=>({}));if(/credit|billing/i.test(JSON.stringify(j)))return toast('Clé valide mais sans crédit : ajoutez du crédit dans Billing')}
    }catch(e){}
    S.ai.key=k;save();render();toast('Réponses IA activées')},
  'water':b=>{const D=day(cur),n=+b.dataset.n;D.water=(D.water||0)/250>=n?(n-1)*250:n*250;leaveDemo();save();render()},
  'fast-start':b=>{S.fast={start:Date.now(),h:+b.dataset.h};save();render();toast('Chrono lancé')},
  'fast-stop':()=>{const h=S.fast?(Date.now()-S.fast.start)/36e5:0;S.fast=null;save();render();toast(`Jeûne de ${nf(h,1)} h enregistré`)},
  'reset-ok':()=>{S=blank();save();tab='profil';render();toast('Données effacées')},
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t&&!t.closest('#pform')){tab=t.dataset.tab;if(tab!=='jour')cur=today();closeSheet();render();window.scrollTo(0,0);return}
  const mp=e.target.closest('[data-meal-pick]');if(mp){sheetCtx.meal=mp.dataset.mealPick;document.querySelectorAll('[data-meal-pick]').forEach(x=>x.setAttribute('aria-pressed',x===mp));return}
  const a=e.target.closest('[data-act]');if(a&&actions[a.dataset.act]){e.preventDefault();actions[a.dataset.act](a)}
});
document.addEventListener('submit',e=>{if(e.target.id==='chatform'){e.preventDefault();actions['chat-send']()}});
document.addEventListener('input',e=>{if(e.target.id==='fq'){clearTimeout(searchT);const v=e.target.value;searchT=setTimeout(()=>showResults(v),380)}});
document.addEventListener('change',e=>{if(e.target.id==='mealphoto'&&e.target.files[0]){runScan({file:e.target.files[0]});return}});
document.addEventListener('input',e=>{if(e.target.closest('.drow')||e.target.id==='rv-plat')rvSync()});
document.addEventListener('change',e=>{if(e.target.id==='xmlfile'&&e.target.files[0]){$('#xmlprog').textContent='Lecture… 0 %';importHealthXML(e.target.files[0]).catch(er=>{$('#xmlprog').textContent='';toast('Fichier illisible : '+er.message)})}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});

render();
handleOAuthReturn();
if(S.strava?.refresh&&!inFrame&&Date.now()-(S.strava.last||0)>30*60e3){stravaSync().then(n=>{if(n)render()}).catch(()=>{})}
if('serviceWorker' in navigator&&!inFrame&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>

</body>
</html>
